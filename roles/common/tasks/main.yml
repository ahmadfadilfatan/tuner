---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian" and common_update_cache

- name: Update dnf cache
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == "RedHat" and common_update_cache

- name: Install baseline packages (Debian family)
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install baseline packages (RedHat family)
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Set system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure /etc/motd is present
  ansible.builtin.copy:
    content: |
      Managed by Ansible — tuner role 'common'
      Host: {{ inventory_hostname }}
      Environment: {{ environment | default('dev') }}
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
